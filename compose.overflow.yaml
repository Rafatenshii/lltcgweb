# Match-primary / overflow stack — Redis for live rooms + capped PHP API.
# See docs/overhaul/01-match-store.md and docs/DEPLOY.md.
services:
  redis:
    image: redis:7-alpine
    container_name: lltcgweb-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  tcg-api:
    build: .
    container_name: lltcgweb-api
    ports:
      - "127.0.0.1:5003:80"
    volumes:
      - ./:/var/www/html
      - ./data:/var/www/html/data
      - ./games:/var/www/html/games
      - ./experiment_decks:/var/www/html/experiment_decks
      - ./cardimg:/var/www/html/cardimg
    environment:
      TCG_PRODUCTION: "1"
      TCG_DEBUG: "0"
      TCG_CORS_ORIGINS: "https://loveliveradio.ca,https://www.loveliveradio.ca"
      TCG_SYNC_ENABLED: "1"
      TCG_GAME_STORE: "redis"
      TCG_REDIS_URL: "redis://redis:6379"
      TCG_REDIS_PREFIX: "lltcg:room:"
      TCG_GAME_SNAPSHOT_DIR: "/var/www/html/games"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api.php?action=ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
